[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
    # libfuzzer-sys, pulled in by rav1e through GPUI's image dependency.
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# GPUI 0.2.2 (the newest release) pulls in several unmaintained transitive
# crates through cosmic-text, usvg, zed-async-tar and its image dependency.
# Only direct workspace dependencies should fail this check; transitive
# advisories are tracked upstream until a newer GPUI is available.
unmaintained = "workspace"
yanked = "deny"
