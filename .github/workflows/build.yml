name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Volvid.exe
            source: target/release/Volvid.exe
          - os: ubuntu-latest
            artifact: Volvid
            source: target/release/Volvid
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --release --locked -p volvid-gui
      - name: Collect artifact
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: volvid-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: volvid-*
          merge-multiple: true
          path: dist
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: |
            dist/Volvid.exe
            dist/Volvid
