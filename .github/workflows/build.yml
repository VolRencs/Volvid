name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Volvid.exe
            build_cmd: go install github.com/akavel/rsrc@v0.10.2 && ./scripts/build-windows-downloader.sh Volvid.exe
          - os: ubuntu-latest
            artifact: Volvid
            build_cmd: ./scripts/build-linux-downloader.sh Volvid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      - name: version from tag
        shell: bash
        run: echo "VOLVID_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - shell: bash
        run: ${{ matrix.build_cmd }}
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ matrix.artifact }}
