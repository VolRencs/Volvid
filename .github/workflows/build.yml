name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VolRenDownloader.exe
          - os: ubuntu-latest
            artifact: VolRenDownloader_linux_amd64
            build_cmd: GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o VolRenDownloader_linux_amd64 ./cmd/downloader
          - os: ubuntu-latest
            artifact: VolRenDownloader_linux_arm64
            build_cmd: GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o VolRenDownloader_linux_arm64 ./cmd/downloader
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --no-progress -y
      - if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build-windows-downloader.sh VolRenDownloader.exe
      - if: runner.os != 'Windows'
        run: ${{ matrix.build_cmd }}
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ matrix.artifact }}
