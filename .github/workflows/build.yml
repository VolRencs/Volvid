name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Volvid.exe
            source: target/release/Volvid.exe
            bundle: volvid-windows-x86_64
          - os: ubuntu-latest
            artifact: Volvid
            source: target/release/Volvid
            bundle: volvid-linux-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --release --locked -p volvid-gui
      - name: Collect artifact
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches the workspace version
        shell: bash
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: volvid-*
          merge-multiple: true
          path: dist
      - name: Make the Linux binary executable
        run: chmod +x dist/Volvid
      - name: Generate update manifest and checksums
        shell: bash
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          python3 scripts/release-manifest.py dist "$version" "$GITHUB_REF_NAME"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME is already published" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Volvid $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/Volvid \
            dist/Volvid.exe \
            dist/latest.json \
            dist/SHA256SUMS.txt \
            --clobber
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          names="$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')"
          for name in Volvid Volvid.exe latest.json SHA256SUMS.txt; do
            if ! grep -qx "$name" <<<"$names"; then
              echo "Release $GITHUB_REF_NAME is missing $name" >&2
              exit 1
            fi
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Verify the public update manifest
        shell: bash
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          for attempt in 1 2 3 4 5; do
            if python3 scripts/check-update-manifest.py "$url" "$version"; then
              exit 0
            fi
            sleep 3
          done
          echo "The public latest.json did not become available" >&2
          exit 1
      - name: Smoke-test the release updater
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./dist/Volvid --update-check --json; then
              exit 0
            fi
            sleep 3
          done
          exit 1
