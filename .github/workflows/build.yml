name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: VolRenDownloader.exe
            build_cmd: go install github.com/akavel/rsrc@latest && ./scripts/build-windows-downloader.sh VolRenDownloader.exe
          - os: ubuntu-latest
            artifact: VolRenDownloader_linux_amd64
            build_cmd: ./scripts/build-linux-downloader.sh VolRenDownloader_linux_amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
      - shell: bash
        run: ${{ matrix.build_cmd }}
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ matrix.artifact }}
