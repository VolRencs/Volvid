name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Volvid.exe
            source: target/release/Volvid.exe
          - os: ubuntu-latest
            artifact: Volvid
            source: target/release/Volvid
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p volvid-gui
      - name: Collect artifact
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: ${{ matrix.artifact }}
