name: Build Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────────────────
  #  Windows → .exe
  # ─────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build .exe
        run: |
          pyinstaller `
            --onefile `
            --name VolRenDownloader `
            --console `
            VolRenDownloader.py

      - name: Upload .exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VolRenDownloader.exe
