[package]
name = "volvid-gui"
description = "Volvid desktop GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "Volvid"
path = "src/main.rs"

[dependencies]
volvid-app = { workspace = true }
volvid-core = { workspace = true }
volvid-i18n = { workspace = true }
volvid-engine = { workspace = true }

image = { workspace = true }
jiff = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }

# Linux builds are Wayland-only by design; X11 is not a supported target.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, default-features = false, features = ["wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
winresource = { workspace = true }

[lints]
workspace = true
